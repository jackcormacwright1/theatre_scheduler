[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theatre-sched"
version = "0.1.0"
description = "Booking theatre lists under uncertain case durations: Monte Carlo chance-constrained scheduling on synthetic data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jack Wright" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "scipy>=1.10"]
app = ["streamlit>=1.50", "altair>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
